[package]
name = "en16931-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "EN-16931 semantic model, validation rule types, and interpreter with audit trail"
keywords = ["en16931", "invoice", "peppol", "schematron"]
categories = ["parsing", "finance"]

[dependencies]
