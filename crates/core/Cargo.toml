[package]
name = "en16931-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "EN-16931 semantic model, validation rule types, and interpreter with audit trail"
keywords = ["en16931", "invoice", "peppol", "schematron"]
categories = ["parsing", "finance"]

[dependencies]
cefact-units = "0.1"
email_address = "0.2"
iban_validate = "5"
iso_currency = "0.5.3"
isocountry = "0.3"
mime = { version = "0.3", optional = true }
num_enum = "0.7"
parse-display = "0.11"
quick-xml = { version = "0.41", default-features = false }
rust_decimal = { version = "1", default-features = false }
time = { version = "0.3", default-features = false }
url = "2"

[features]
# Enables conversions between `MimeCode` and the `mime` crate's `Mime` type.
mime = ["dep:mime"]
